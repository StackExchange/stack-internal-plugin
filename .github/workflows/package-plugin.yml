name: Package plugin

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Create plugin archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create ZIP archive
        env:
          ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ github.sha }}.zip
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/${ARCHIVE_NAME}" HEAD

      - name: Upload ZIP archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
